<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#0a0d11}

background:#0f1216;border:1px solid #2b333c;color:#eef2f4;border-radius:8px;padding:9px 10px;font-size:13.5px;outline:none;font-family:inherit
}

.print-head-title{font-size:15px;font-weight:800}.print-head-sub{font-size:8px;color:#555;margin-top:2px}.print-generated{font-size:9pt;font-weight:800;color:#0b4fae;margin-top:3px}.print-op{font-size:15px;font-weight:900}.op-carlos{color:#0b63ce!important}.op-sebastian{color:#7b35c8!important}.op-michael{color:#d96a13!important}.op-manuel{color:#159447!important}

.print-images-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;gap:4px;padding:4px}.print-image-item{border:1px solid #d0d5da;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#fff}.print-image-item img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}.print-no-image{font-size:8px;color:#777;text-align:center;padding:8px}

.print-table tr:nth-child(odd) td{background:#eef2f5}.print-table tr:nth-child(even) td{background:#fff}.print-table td:first-child{width:38%;font-weight:700;color:#26313a}.print-payment-credit td{background:#fff!important}.print-payment-credit .print-payment-method{font-weight:700;margin-right:6px}.print-payment-credit .print-payment-values{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%;box-sizing:border-box}.print-payment-credit .print-payment-cell{font-size:6pt;line-height:1;white-space:nowrap;box-sizing:border-box;padding:0 4px;font-weight:700;display:flex;align-items:center;gap:2px}.print-payment-credit .print-payment-cell + .print-payment-cell{border-left:1px solid #c8cdd2}.print-payment-credit .print-payment-credit-wrap{display:flex;align-items:center;gap:6px;width:100%;min-width:0}.print-payment-credit .print-payment-method{font-size:6pt;font-weight:700;color:#111;white-space:nowrap}.print-payment-credit .print-payment-values{display:flex;flex:1;min-width:0}.print-payment-credit .print-payment-cell{font-size:6pt;line-height:1;white-space:nowrap;box-sizing:border-box;padding:0 3px;font-weight:700;display:flex;align-items:center;gap:1px;flex:1;min-width:0}.print-payment-credit .print-payment-cell + .print-payment-cell{border-left:1px solid #c8cdd2}.print-payment-credit .print-abono{color:#08752f}.print-payment-credit .print-saldo{color:#a40000}

}
@media(max-width:700px){
#app-root{padding:13px}

.metric-hero{background:linear-gradient(145deg,#0d3c78,#09254c)}.metric-status{padding-bottom:14px}.metric-status .metric-number{font-size:26px}.metric-bar{height:5px;background:#183557;border-radius:999px;overflow:hidden;margin-top:12px}.metric-bar span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#1474e8,#25cfff);transition:width .35s ease}

const CLIENT_SUGGESTIONS_KEY="op-client-suggestions";
function getClientSuggestions(){
 try{
  const raw=JSON.parse(localStorage.getItem(CLIENT_SUGGESTIONS_KEY)||"[]");
  const counts={};
  if(Array.isArray(raw)){
   raw.forEach(v=>{
    if(typeof v==="string"&&v.trim()){
     const name=v.trim(),key=name.toLowerCase();
     if(!counts[key])counts[key]={name,count:1,last:0};
     else counts[key].count++;
    }else if(v&&typeof v==="object"&&typeof v.name==="string"&&v.name.trim()){
     const name=v.name.trim(),key=name.toLowerCase();
     counts[key]={name,count:Math.max(1,n(v.count)),last:n(v.last)};
    }
   });
  }
  (state.orders||[]).forEach(o=>{
   const name=String(o.client||"").trim();
   if(!name)return;
   const key=name.toLowerCase();
   if(!counts[key])counts[key]={name,count:0,last:0};
   counts[key].count++;
  });
  return Object.values(counts)
   .sort((a,b)=>(b.count-a.count)||(b.last-a.last)||a.name.localeCompare(b.name,"es"))
   .slice(0,100)
   .map(x=>x.name);
 }catch(e){return []}
}
function saveClientSuggestion(value){
 const name=String(value||"").trim();
 if(name.length<2)return;
 try{
  const raw=JSON.parse(localStorage.getItem(CLIENT_SUGGESTIONS_KEY)||"[]");
  const items=Array.isArray(raw)?raw:[];
  const now=Date.now(),key=name.toLowerCase();
  const idx=items.findIndex(v=>
   (typeof v==="string"&&v.trim().toLowerCase()===key) ||
   (v&&typeof v==="object"&&String(v.name||"").trim().toLowerCase()===key)
  );
  if(idx>=0){
   const old=items[idx];
   items[idx]={
    name,
    count:Math.max(0,typeof old==="object"?n(old.count):1)+1,
    last:now
   };
  }else{
   items.push({name,count:1,last:now});
  }
  items.sort((a,b)=>n(b.count)-n(a.count)||n(b.last)-n(a.last));
  localStorage.setItem(CLIENT_SUGGESTIONS_KEY,JSON.stringify(items.slice(0,100)));
 }catch(e){}
}

function readAndCompressImage(file){
 return new Promise((resolve,reject)=>{
  if(!file){resolve(null);return}
  if(!file.type||!file.type.startsWith("image/")){reject(new Error("Selecciona un archivo de imagen."));return}
  const reader=new FileReader();reader.onerror=()=>reject(new Error("No se pudo leer la imagen."));
  reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error("La imagen no es válida."));img.onload=()=>{
   const maxSide=1100,scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
   const w=Math.max(1,Math.round(img.naturalWidth*scale)),hh=Math.max(1,Math.round(img.naturalHeight*scale));
   const canvas=document.createElement("canvas");canvas.width=w;canvas.height=hh;const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,hh);
   let quality=.76,data=canvas.toDataURL("image/jpeg",quality);while(data.length>180000&&quality>.35){quality-=.06;data=canvas.toDataURL("image/jpeg",quality)}
   if(data.length>260000){reject(new Error("La imagen sigue siendo demasiado grande. Usa una imagen más pequeña."));return}
   resolve({data,name:file.name});
  };img.src=reader.result};reader.readAsDataURL(file);
 });
}

   const c={};snap.forEach(d=>c[d.id]=(d.data()||{}).lastNumber||0);

  },err=>{firestoreError=err.message;state.countersReady=true;render()});

function submitOrder(){

 if(!designer){alert("Selecciona un diseñador.");return}
 if(!f.client.trim()){alert("Escribe el cliente.");return}
 if(!db){alert("La base de datos no está disponible.");return}
 syncMaterialLength();
 const cons=computeConsumables(f);
 const paymentMethod=f.paymentMethod||"";
 const abono=paymentNeedsAmounts(paymentMethod)?n(f.abono):0;
 const saldo=paymentNeedsAmounts(paymentMethod)?n(f.saldo):0;

 const common={
  designer,client:f.client.trim(),clientPhone:f.clientPhone.trim(),job:f.job.trim(),date:f.date,deliveryDate:f.deliveryDate,
  deliveryTime:f.deliveryTime,machine:f.machine,material:f.material,finish:f.finish,laminate:f.laminate,
  status:f.status,width:n(f.width),height:n(f.height),materialWidth:n(f.materialWidth),
  materialLength:n(f.materialLength),quantity:Math.max(1,Math.round(n(f.quantity))||1),
  notes:f.notes.trim(),paymentMethod,abono,saldo,imageData:imageArray(f.imageData),imageName:(f.imageNames&&f.imageNames[0])||"",imageNames:Array.isArray(f.imageNames)?f.imageNames:[],tubes:cons.tubes,cord:cons.cord,
  plugs:cons.plugs,eyelets:Math.max(0,Math.round(n(f.eyelets))||0)
 };

 if(state.editingId){
  db.collection("orders").doc(state.editingId).update(common).then(()=>{
   state.editingId=null;state.form=blankForm();setState({tab:"orders"});
  }).catch(e=>alert("No se pudo actualizar: "+e.message));
  return;
 }

 const opNum=nextOp(designer);
 const now=Date.now();
 const order={...common,id:uid(),opNum,opCode:opLabel(designer,opNum),createdAt:now,generatedAt:now};
 db.collection("orders").doc(order.id).set(order).then(()=>{
  return db.collection("counters").doc(designer.trim().toUpperCase()).set({lastNumber:opNum});
 }).then(()=>{
  state.form=blankForm();setState({tab:"orders"});
 }).catch(e=>alert("No se pudo guardar la orden: "+e.message));
}

async function exportOrderPdf(id){
 const o=state.orders.find(x=>x.id===id);if(!o)return;
 const pa=document.getElementById("print-area");
 pa.innerHTML=printableOrderHtml(o);
 const prev={
  display:pa.style.display,visibility:pa.style.visibility,position:pa.style.position,
  left:pa.style.left,top:pa.style.top,width:pa.style.width,height:pa.style.height,
  padding:pa.style.padding,boxSizing:pa.style.boxSizing
 };

 // La página NO se escala ni se transforma. Se imprime directamente en
 // media carta horizontal: 8.5 × 5.5 pulgadas.
 pa.style.display="block";
 pa.style.visibility="hidden";
 pa.style.position="static";
 pa.style.left="auto";
 pa.style.top="auto";
 pa.style.width="8.5in";
 pa.style.height="5.5in";
 pa.style.padding="0.25in";
 pa.style.boxSizing="border-box";

 // Esperar a que las imágenes estén listas para que no aparezcan espacios vacíos.
 const images=Array.from(pa.querySelectorAll("img"));
 await Promise.all(images.map(img=>new Promise(resolve=>{
  if(img.complete){
   if(img.decode)img.decode().catch(()=>{}).finally(resolve); else resolve();
  }else{
   img.addEventListener("load",resolve,{once:true});
   img.addEventListener("error",resolve,{once:true});
  }
 })));
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));

 const cleanup=()=>{
  pa.style.display=prev.display;
  pa.style.visibility=prev.visibility;
  pa.style.position=prev.position;
  pa.style.left=prev.left;
  pa.style.top=prev.top;
  pa.style.width=prev.width;
  pa.style.height=prev.height;
  pa.style.padding=prev.padding;
  pa.style.boxSizing=prev.boxSizing;
 };
 window.addEventListener("afterprint",cleanup,{once:true});

 // Se muestra en su posición real antes de imprimir. No hay scale(), zoom,
 // reducción automática ni modificación del tamaño de la orden.
 pa.style.visibility="visible";
 await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
 window.print();
}

  const total=orders.filter(o=>o.designer===d).length;

  return `<div class="bar-group">

  </div>`;
 }).join("")}</div>
 <div class="legend">${STATUS.map(s=>`<span class="legend-item"><i class="legend-dot" style="background:${chartColors[s]}"></i>${s}</span>`).join("")}</div>`;
}

function simpleBarChart(items, labelKey="label", valueKey="value", suffix=""){
 const max=Math.max(1,...items.map(x=>Number(x[valueKey])||0));
 return `<div class="bar-chart">${items.map(x=>{
  const v=Number(x[valueKey])||0;
  return `<div class="bar-group">
   <div class="bar-stack" style="height:${Math.max(v?3:1,v/max*185)}px;background:#57c1e8"><div class="bar" style="height:100%;background:#57c1e8"></div></div>
   <div class="bar-label">${esc(String(x[labelKey]))}<br>${fmtNum(v,0)}${suffix}</div>
  </div>`;
 }).join("")}</div>`;
}

function statusPercentChart(designers, orders){
 return `<div class="bar-chart">${designers.map(d=>{
  const mine=orders.filter(o=>o.designer===d);
  const total=mine.length||1;
  let used=0;
  const parts=STATUS.map(s=>{
   const c=mine.filter(o=>o.status===s).length;
   const pct=c/total*100; used+=pct;
   return {s,pct};
  }).filter(x=>x.pct>0);
  return `<div class="bar-group">
   <div class="bar-stack" style="height:185px">${parts.map(x=>`<div class="bar" style="height:${x.pct}%;background:${chartColors[x.s]}" title="${x.s}: ${x.pct.toFixed(1)}%"></div>`).join("")}</div>
   <div class="bar-label">${esc(d)}<br>100%</div>
  </div>`;
 }).join("")}</div>
 <div class="legend">${STATUS.map(s=>`<span class="legend-item"><i class="legend-dot" style="background:${chartColors[s]}"></i>${s}</span>`).join("")}</div>`;
}

function render(){
 const active=document.activeElement;
 const activeField=active&&active.closest?active.closest("[data-field]"):null;
 const focusKey=activeField?activeField.dataset.field:"";
 const activeId=active&&active.id?active.id:"";
 const selectionStart=active&&typeof active.selectionStart==="number"?active.selectionStart:null;
 const selectionEnd=active&&typeof active.selectionEnd==="number"?active.selectionEnd:null;
 if(!state.ordersReady||!state.countersReady){
  root.innerHTML=header()+`<div class="op-card" style="margin-top:20px"><p style="color:#8b96a3">Conectando con la base de datos...</p></div>`;
  bind();return;
 }
 if(firestoreError){
  root.innerHTML=header()+`<div class="op-modal-bg"><b style="color:#f6602c">No se pudo conectar a la base de datos</b><p style="font-size:13px;line-height:1.6">Detalle técnico: ${esc(firestoreError)}</p><p class="op-note">Verifica que Firestore esté habilitado y que sus reglas permitan lectura y escritura.</p></div>`;
  bind();return;
 }

 let body="";
 if(state.showAdminPin)body=pinBox();
 else if(state.showViewerPin)body=viewerPinBox();
 else if(state.showDesignerPin)body=designerPinBox();
 else if(!state.role&&!state.isAdmin&&!state.isViewer)body=`<div class="op-card" style="margin-top:20px;text-align:center;padding:35px"><b style="color:#ffffff">Elige tu perfil para continuar</b><p class="op-note">Selecciona tu nombre de diseñador. Para Administrador se solicitará el PIN.</p></div>`;
 else if(state.isViewer)body=tabsBar()+ordersTab();
 else if(state.tab==="dashboard"&&state.isAdmin)body=tabsBar()+dashboardTab();
 else if(state.tab==="admin"&&state.isAdmin)body=tabsBar()+adminCountersTab();
 else if(state.tab==="orders")body=tabsBar()+ordersTab();
 else body=tabsBar()+newOrderTab();

 root.innerHTML=header()+body;
 bind();
 if(focusKey||activeId){
  const next=focusKey
   ? root.querySelector(`[data-field="${CSS.escape(focusKey)}"]`)
   : (activeId?root.querySelector(`#${CSS.escape(activeId)}`):null);
  if(next){
   next.focus({preventScroll:true});
   if(selectionStart!=null&&typeof next.setSelectionRange==="function"){
    try{next.setSelectionRange(selectionStart,selectionEnd==null?selectionStart:selectionEnd)}catch(e){}
   }
  }
 }
}

function autoGrowTextarea(el){
 if(!el)return;
 el.style.height="auto";
 el.style.height=Math.max(el.scrollHeight,54)+"px";
}
function bind(){
 root.querySelectorAll("[data-tab]").forEach(el=>el.onclick=()=>setState({tab:el.dataset.tab}));
 const roleSel=root.querySelector("#role-select");
 if(roleSel)roleSel.onchange=e=>{
  const v=e.target.value;
  if(v==="__ADMIN__"){state.showAdminPin=true;state.showViewerPin=false;state.showDesignerPin=false;state.adminPinError="";render();return}
  if(v==="__VIEWER__"){state.showViewerPin=true;state.showAdminPin=false;state.showDesignerPin=false;state.viewerPinError="";render();return}
  if(DESIGNER_PINS[v]){state.pendingDesigner=v;state.showDesignerPin=true;state.showAdminPin=false;state.showViewerPin=false;state.designerPinError="";render()}
 };

 const logout=root.querySelector("#logout-btn");
 if(logout)logout.onclick=()=>{state.role=null;state.isAdmin=false;state.isViewer=false;state.showAdminPin=false;state.showViewerPin=false;state.showDesignerPin=false;saveSession();setState({tab:"new"})};

 const ap=root.querySelector("#admin-pin-input");
 const as=root.querySelector("#admin-pin-submit");
 const ac=root.querySelector("#admin-pin-cancel");

 const imageInput=root.querySelector("#order-image");
 const imagePasteZone=root.querySelector("#image-paste-zone");
 const addImages=async(files,sourceInput)=>{
  const list=Array.from(files||[]).filter(f=>f&&f.type&&f.type.startsWith("image/"));
  if(!list.length){if(files&&files.length)alert("El contenido pegado no contiene una imagen.");return}
  const current=imageArray(state.form.imageData),available=5-current.length;
  if(available<=0){alert("Puedes guardar hasta 5 imágenes por OP.");if(sourceInput)sourceInput.value="";return}
  const selected=list.slice(0,available);
  if(list.length>available)alert("Solo se agregarán las primeras "+available+" imágenes para completar el máximo de 5.");
  try{
   const results=[];
   for(const file of selected)results.push(await readAndCompressImage(file));
   state.form.imageData=current.concat(results.map(r=>r.data));
   const existingNames=Array.isArray(state.form.imageNames)?state.form.imageNames:[];
   state.form.imageNames=existingNames.concat(results.map((r,i)=>r.name||("Imagen "+(existingNames.length+i+1))));
   state.form.imageName=state.form.imageNames[0]||"";
   render();
  }catch(err){alert(err.message);if(sourceInput)sourceInput.value=""}
 };
 if(imageInput)imageInput.onchange=e=>addImages(e.target.files,imageInput);
 if(imagePasteZone)imagePasteZone.onpaste=e=>{
  const items=Array.from(e.clipboardData?.items||[]);
  const files=items.map(item=>item.kind==="file"?item.getAsFile():null).filter(Boolean);
  if(files.length){e.preventDefault();addImages(files,null)}
 };
 const removeImage=root.querySelector("#remove-image");
 if(removeImage)removeImage.onclick=()=>{state.form.imageData=[];state.form.imageNames=[];state.form.imageName="";render()};

 const form=root.querySelector("#order-form");
 if(form){
  const tabOrder=["designer","client","clientPhone","job","date","deliveryDate","deliveryTime","width","height","materialWidth","materialLength","quantity","machine","material","laminate","finish","eyelets","status","paymentMethod","abono","saldo","notes"];
  // El recorrido con TAB queda limitado exclusivamente a los campos de la OP.
  // No usamos tabindex positivos porque pueden provocar saltos cuando el formulario se vuelve a renderizar.
  tabOrder.forEach((key)=>{
   const el=form.querySelector(`[data-field="${CSS.escape(key)}"]`);
   if(el)el.tabIndex=0;
  });
  const opFields=tabOrder.map(key=>form.querySelector(`[data-field="${CSS.escape(key)}"]`)).filter(Boolean);
  opFields.forEach((el,index)=>{
   el.onkeydown=(e)=>{
    if(e.key!="Tab")return;
    e.preventDefault();
    const nextIndex=e.shiftKey ? index-1 : index+1;
    const targetIndex=nextIndex<0 ? opFields.length-1 : nextIndex>=opFields.length ? 0 : nextIndex;
    const target=opFields[targetIndex];
    if(target){
     target.focus({preventScroll:true});
     if(typeof target.select==="function" && target.tagName!=="SELECT" && target.type!=="date" && target.type!=="time")target.select();
    }
   };
  });
  const pasteZone=form.querySelector("#image-paste-zone");
  if(pasteZone)pasteZone.tabIndex=-1;
  const fileInput=form.querySelector("#order-image");
  if(fileInput)fileInput.tabIndex=-1;
  form.querySelectorAll("[data-field]").forEach(el=>{
   const key=el.dataset.field;
   el.oninput=()=>{
    state.form[key]=el.value;
    if(key==="notes")autoGrowTextarea(el);
   };
   el.onchange=()=>{
    state.form[key]=el.value;
    if(key==="height")syncMaterialLength();
    if(["height","finish","width","quantity","paymentMethod"].includes(key)){
     const focusKey=document.activeElement?.dataset?.field||key;
     render();
     if(focusKey){
      requestAnimationFrame(()=>{
       const next=document.querySelector(`#order-form [data-field="${CSS.escape(focusKey)}"]`);
       if(next){
        next.focus({preventScroll:true});
        if(typeof next.select==="function" && next.tagName!=="SELECT" && next.type!=="date" && next.type!=="time")next.select();
       }
      });
     }
    }
   };
  });
  form.onsubmit=e=>{e.preventDefault();saveClientSuggestion(state.form.client);submitOrder()};
  const clientInput=form.querySelector('[data-field="client"]');
  if(clientInput)clientInput.onblur=()=>saveClientSuggestion(clientInput.value);
  const notesArea=form.querySelector('textarea[data-field="notes"]');
  if(notesArea)autoGrowTextarea(notesArea);
 }
